name: quran_video_studio
description: "NUQTA — éditeur mobile de vidéos verticales (9:16) de récitation coranique : audio, texte arabe et traduction synchronisés."
publish_to: "none"
version: 5.0.0+6

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  http: ^1.2.0
  path_provider: ^2.1.0
  image_picker: ^1.1.0
  video_player: ^2.8.0
  just_audio: ^0.9.36
  gal: ^2.3.0
  share_plus: ^10.0.0
  ffmpeg_kit_flutter_new: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Les .ttf sont téléchargés par le workflow CI (licence SIL OFL) et le
  # nuqta_logo.png est dérivé du SVG officiel par la CI,
  # voir .github/workflows/build-apk.yml.
  assets:
    - assets/fonts/
    - assets/branding/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
