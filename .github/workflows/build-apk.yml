name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Nécessaire pour publier les APK en Release (téléchargement direct mobile).
permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Flutter release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (version épinglée pour un scaffold déterministe)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.4"
          cache: true

      # Les polices sont des binaires : elles ne vivent pas dans le repo,
      # le CI les récupère depuis le dépôt Google Fonts (licence SIL OFL).
      - name: Download Arabic fonts (Amiri, Scheherazade New — SIL OFL)
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/Amiri-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf"
          curl -fsSL -o assets/fonts/Amiri-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf"
          curl -fsSL -o assets/fonts/ScheherazadeNew-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/scheherazadenew/ScheherazadeNew-Regular.ttf"
          ls -lh assets/fonts

      # Le repo ne contient que lib/ + pubspec : le dossier android/ (dont le
      # gradle-wrapper.jar binaire) est régénéré ici. pubspec et lib sont
      # sauvegardés puis restaurés au cas où flutter create les toucherait.
      - name: Generate Android platform scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp -r lib /tmp/lib.bak
          flutter create . --platforms=android --project-name quran_video_studio --org dev.adamlahlou
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          rm -rf lib
          cp -r /tmp/lib.bak lib
          rm -f test/widget_test.dart

      # minSdk 24 requis par ffmpeg_kit_flutter_new ; manifeste réécrit pour
      # ajouter INTERNET (release) + permissions stockage rétro-compatibles.
      # La signature debug auto-générée par Gradle rend l'APK installable
      # sur Android 13/14 ("sources inconnues").
      - name: Patch Android project (minSdk 24, permissions, app label)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <application
                  android:label="NUQTA"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"
                          />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          EOF

      # Toutes les ressources visuelles sont dérivées du SVG officiel
      # (assets/branding/nuqta_logo.svg) : icône launcher (5 densités),
      # icône adaptative Android 8+ (fond nuit + rosace dorée), splash
      # screen, et logo affiché dans l'application.
      - name: Generate NUQTA branding (icons, splash, in-app logo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 assets/branding/nuqta_logo.svg -o assets/branding/nuqta_logo.png
          for e in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${e%%:*}"; s="${e##*:}"
            mkdir -p "android/app/src/main/res/mipmap-$d"
            rsvg-convert -w "$s" -h "$s" assets/branding/nuqta_logo.svg -o "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          for e in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            d="${e%%:*}"; s="${e##*:}"
            rsvg-convert -w "$s" -h "$s" assets/branding/nuqta_foreground.svg -o "android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values android/app/src/main/res/drawable-nodpi
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/nuqta_icon_bg"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/values/nuqta_colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="nuqta_icon_bg">#020617</color></resources>
          EOF
          rsvg-convert -w 384 -h 384 assets/branding/nuqta_logo.svg -o android/app/src/main/res/drawable-nodpi/splash_logo.png
          cat > android/app/src/main/res/drawable/launch_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/nuqta_icon_bg"/>
              <item><bitmap android:gravity="center" android:src="@drawable/splash_logo"/></item>
          </layer-list>
          EOF
          ls -R android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable-nodpi assets/branding

      - name: Resolve dependencies
        run: flutter pub get

      # Portes qualité : le build échoue si l'analyse statique ou un test
      # unitaire (catalogue récitateurs, timings ASS, filtre FFmpeg) échoue.
      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      # --split-per-abi : APK par architecture (~4× plus légers que l'APK
      # universel, FFmpeg embarquant des binaires natifs volumineux).
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Read app version
        id: appver
        run: echo "version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Rename APKs with version
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "NUQTA-v${{ steps.appver.outputs.version }}-${abi}.apk"
          done
          ls -lh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuqta-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/NUQTA-v*.apk
          retention-days: 7
          if-no-files-found: error

      # Release publique : APK téléchargeables directement depuis un téléphone
      # (l'onglet Artifacts exige d'être connecté, pas les Releases).
      - name: Publish GitHub Release with APKs
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.appver.outputs.version }}-build${{ github.run_number }}"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/NUQTA-v*.apk \
            --title "NUQTA v${{ steps.appver.outputs.version }} (build ${{ github.run_number }})" \
            --notes "APK générés automatiquement par GitHub Actions.

          📱 **Sur un téléphone récent (2017+) : télécharger et installer \`NUQTA-v${{ steps.appver.outputs.version }}-arm64-v8a.apk\`.**
          Autres fichiers : armeabi-v7a (vieux appareils), x86_64 (émulateurs)."
